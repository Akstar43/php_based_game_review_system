<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
</head>
<body>
    <form>
        <table border="1">
            <tr>
                <td>your name<input type="text" name="name"/></td>
            </tr>
            <tr>
                <td>your email<input type="email" name="email"/></td>
            </tr>
            <tr>
                <td>your message<textarea name="message" rows="5" cols="30"></textarea></td>
            </tr>
            <tr>
                <td><input type="submit" value="submit"></td>
            </tr>
            <tr>
                <td><input type="reset" value="clear"></td>
            </tr>
        </table>
    </form> 
</body>
</html>
